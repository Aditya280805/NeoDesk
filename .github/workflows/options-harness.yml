name: Options engineering harness
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neo-trading-terminal/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -c requirements.lock
      - run: python -m pip check
      - run: python -m pytest tests -q
      - run: python -m app.terminal.options_evals
  analytics-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: neo-trading-terminal/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=:all: -r requirements.txt -c requirements.lock
      - run: python -m pip check
      - run: python -m pytest tests/test_analytics_v2.py tests/test_analytics_capture.py tests/test_analytics_route.py tests/test_analytics_stage.py -q -p no:cacheprovider
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neo-trading-terminal/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
